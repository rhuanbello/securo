name: Provision Apuracao on Nimbus

on:
  push:
    branches:
      - ops/provision-apuracao

permissions:
  contents: write

jobs:
  provision:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      API: https://coolify.rhuanbello.com/api/v1
      SERVER_UUID: aw6dv4e0y3xcxvf1wqsyoxby
      GITHUB_APP_UUID: glzwmzk0xnbnpye2vkjlaf0s

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ops/provision-apuracao

      - name: Provision Apuracao
        env:
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
        run: |
          set -u

          REPORT=".ops/apuracao-provision-report.json"
          mkdir -p .ops

          AUTH=(-H "Authorization: Bearer $COOLIFY_TOKEN")
          JSON=(-H "Content-Type: application/json")

          get() {
            local path="$1"
            local output="$2"
            curl --silent --show-error -o "$output" -w '%{http_code}'               "${AUTH[@]}" "$API$path"
          }

          post() {
            local path="$1"
            local body="$2"
            local output="$3"
            curl --silent --show-error -o "$output" -w '%{http_code}'               -X POST "${AUTH[@]}" "${JSON[@]}" "$API$path" -d "$body"
          }

          PROJECTS_CODE="$(get /projects /tmp/projects.json)"
          PROJECT_UUID="$(jq -r '[.[] | select((.name // "" | ascii_downcase) == "apuracao")][0].uuid // empty' /tmp/projects.json)"

          PROJECT_CREATE_CODE=""
          PROJECT_CREATE_MESSAGE=""

          if [[ -z "$PROJECT_UUID" ]]; then
            PROJECT_CREATE_CODE="$(post /projects '{"name":"Apuracao","description":"Live Brazilian election results"}' /tmp/project-create.json)"
            PROJECT_UUID="$(jq -r '.uuid // empty' /tmp/project-create.json 2>/dev/null || true)"
            PROJECT_CREATE_MESSAGE="$(jq -r '.message // empty' /tmp/project-create.json 2>/dev/null || true)"
          fi

          if [[ -z "$PROJECT_UUID" ]]; then
            jq -n               --arg stage "project"               --arg projects_code "$PROJECTS_CODE"               --arg create_code "$PROJECT_CREATE_CODE"               --arg message "$PROJECT_CREATE_MESSAGE"               '{ok:false,stage:$stage,http:{projects:$projects_code,create_project:$create_code},message:$message}' > "$REPORT"
            exit 0
          fi

          ENV_CODE="$(get "/projects/$PROJECT_UUID/environments" /tmp/envs.json)"
          ENV_NAME="$(jq -r '[.[] | select((.name // "") == "production")][0].name // empty' /tmp/envs.json 2>/dev/null || true)"
          ENV_CREATE_CODE=""
          ENV_CREATE_MESSAGE=""

          if [[ -z "$ENV_NAME" ]]; then
            ENV_CREATE_CODE="$(post "/projects/$PROJECT_UUID/environments" '{"name":"production"}' /tmp/env-create.json)"
            ENV_CREATE_MESSAGE="$(jq -r '.message // empty' /tmp/env-create.json 2>/dev/null || true)"
          fi

          APPS_CODE="$(get /applications /tmp/apps.json)"
          APP_UUID="$(jq -r '[.[] | select(((.git_repository // "") | contains("rhuanbello/apuracao")) or ((.name // "" | ascii_downcase) == "apuracao"))][0].uuid // empty' /tmp/apps.json)"

          APP_CREATE_CODE=""
          APP_CREATE_MESSAGE=""
          APP_CREATE_RESPONSE=""

          if [[ -z "$APP_UUID" ]]; then
            BODY="$(
              jq -n                 --arg project_uuid "$PROJECT_UUID"                 --arg server_uuid "$SERVER_UUID"                 --arg github_app_uuid "$GITHUB_APP_UUID"                 '{
                  project_uuid: $project_uuid,
                  server_uuid: $server_uuid,
                  environment_name: "production",
                  github_app_uuid: $github_app_uuid,
                  git_repository: "rhuanbello/apuracao",
                  git_branch: "main",
                  build_pack: "dockercompose",
                  name: "apuracao",
                  description: "Live Brazilian election results",
                  docker_compose_location: "/deploy/nimbus/docker-compose.yml",
                  instant_deploy: true,
                  autogenerate_domain: true,
                  is_auto_deploy_enabled: true,
                  is_force_https_enabled: true,
                  connect_to_docker_network: true
                }'
            )"

            APP_CREATE_CODE="$(post /applications/private-github-app "$BODY" /tmp/app-create.json)"
            APP_UUID="$(jq -r '.uuid // empty' /tmp/app-create.json 2>/dev/null || true)"
            APP_CREATE_MESSAGE="$(jq -r '.message // empty' /tmp/app-create.json 2>/dev/null || true)"
            APP_CREATE_RESPONSE="$(jq -c 'del(.token?,.private_key?,.client_secret?,.webhook_secret?)' /tmp/app-create.json 2>/dev/null || true)"
          fi

          if [[ -z "$APP_UUID" ]]; then
            jq -n               --arg stage "application"               --arg project_uuid "$PROJECT_UUID"               --arg env_code "$ENV_CODE"               --arg env_create_code "$ENV_CREATE_CODE"               --arg env_message "$ENV_CREATE_MESSAGE"               --arg applications_code "$APPS_CODE"               --arg create_code "$APP_CREATE_CODE"               --arg message "$APP_CREATE_MESSAGE"               --arg response "$APP_CREATE_RESPONSE"               '{
                ok:false,
                stage:$stage,
                project_uuid:$project_uuid,
                http:{
                  environments:$env_code,
                  create_environment:$env_create_code,
                  applications:$applications_code,
                  create_application:$create_code
                },
                message:$message,
                response:$response
              }' > "$REPORT"
            exit 0
          fi

          STATUS=""
          FQDN=""
          COMPOSE_DOMAINS=""
          for attempt in $(seq 1 60); do
            GET_APP_CODE="$(get "/applications/$APP_UUID" /tmp/app.json)"
            STATUS="$(jq -r '.status // empty' /tmp/app.json)"
            FQDN="$(jq -r '.fqdn // empty' /tmp/app.json)"
            COMPOSE_DOMAINS="$(jq -r '.docker_compose_domains // empty' /tmp/app.json)"

            case "$STATUS" in
              running:healthy|running:unknown|exited:unhealthy|exited:unknown)
                if [[ "$STATUS" == running:* ]]; then
                  break
                fi
                ;;
            esac
            sleep 10
          done

          WEB_URL="$(jq -r '
            if (.docker_compose_domains | type) == "string" then
              (.docker_compose_domains | fromjson? | .web.domain // empty)
            elif (.docker_compose_domains | type) == "object" then
              .docker_compose_domains.web.domain // empty
            else
              empty
            end
          ' /tmp/app.json)"

          if [[ -z "$WEB_URL" ]]; then
            WEB_URL="$(jq -r '.fqdn // empty' /tmp/app.json | cut -d, -f1)"
          fi

          HEALTH_CODE=""
          HEALTH_BODY=""
          if [[ -n "$WEB_URL" ]]; then
            WEB_URL="${WEB_URL%/}"
            HEALTH_CODE="$(curl --silent --show-error -o /tmp/health.json -w '%{http_code}' --retry 3 --retry-delay 3 "$WEB_URL/api/health" || true)"
            HEALTH_BODY="$(jq -c '.' /tmp/health.json 2>/dev/null || head -c 500 /tmp/health.json 2>/dev/null || true)"
          fi

          jq -n             --arg stage "done"             --arg project_uuid "$PROJECT_UUID"             --arg app_uuid "$APP_UUID"             --arg app_status "$STATUS"             --arg fqdn "$FQDN"             --arg compose_domains "$COMPOSE_DOMAINS"             --arg web_url "$WEB_URL"             --arg app_create_code "$APP_CREATE_CODE"             --arg health_code "$HEALTH_CODE"             --arg health_body "$HEALTH_BODY"             '{
              ok:($app_status | startswith("running:")) and ($health_code == "200"),
              stage:$stage,
              project_uuid:$project_uuid,
              app_uuid:$app_uuid,
              app_status:$app_status,
              fqdn:$fqdn,
              compose_domains:$compose_domains,
              web_url:$web_url,
              http:{
                create_application:$app_create_code,
                health:$health_code
              },
              health:$health_body
            }' > "$REPORT"

      - name: Commit sanitized report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .ops/apuracao-provision-report.json
          git diff --cached --quiet && exit 0
          git commit -m "ops: record Apuracao provisioning result"
          git push origin HEAD:ops/provision-apuracao
