name: Diagnose Apuracao provisioning

on:
  push:
    branches:
      - ops/provision-apuracao

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    env:
      API: https://coolify.rhuanbello.com/api/v1

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ops/provision-apuracao

      - name: Diagnose Coolify API
        env:
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
        run: |
          set -u

          REPORT=".ops/apuracao-provision-report.json"
          mkdir -p .ops

          if [[ -z "${COOLIFY_TOKEN:-}" ]]; then
            jq -n '{secret_available:false}' > "$REPORT"
            exit 0
          fi

          request() {
            local path="$1"
            local output="$2"
            local code
            code="$(curl --silent --show-error -o "$output" -w '%{http_code}'               -H "Authorization: Bearer $COOLIFY_TOKEN" "$API$path" || true)"
            echo "$code"
          }

          PROJECTS_CODE="$(request /projects /tmp/projects.json)"
          SERVERS_CODE="$(request /servers /tmp/servers.json)"
          APPS_CODE="$(request /github-apps /tmp/github-apps.json)"
          APPLICATIONS_CODE="$(request /applications /tmp/applications.json)"

          jq -n             --arg projects_code "$PROJECTS_CODE"             --arg servers_code "$SERVERS_CODE"             --arg github_apps_code "$APPS_CODE"             --arg applications_code "$APPLICATIONS_CODE"             --argjson projects "$(jq '[.[]? | {uuid,name}]' /tmp/projects.json 2>/dev/null || echo '[]')"             --argjson servers "$(jq '[.[]? | {uuid,name}]' /tmp/servers.json 2>/dev/null || echo '[]')"             --argjson github_apps "$(jq '[.[]? | {uuid,name,organization,is_public}]' /tmp/github-apps.json 2>/dev/null || echo '[]')"             --argjson applications "$(jq '[.[]? | {uuid,name,status,git_repository,build_pack}]' /tmp/applications.json 2>/dev/null || echo '[]')"             '{
              secret_available: true,
              http: {
                projects: $projects_code,
                servers: $servers_code,
                github_apps: $github_apps_code,
                applications: $applications_code
              },
              projects: $projects,
              servers: $servers,
              github_apps: $github_apps,
              applications: $applications
            }' > "$REPORT"

      - name: Commit sanitized report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .ops/apuracao-provision-report.json
          git diff --cached --quiet && exit 0
          git commit -m "ops: record sanitized Coolify diagnostic"
          git push origin HEAD:ops/provision-apuracao
