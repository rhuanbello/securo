name: Build Nimbus Images

on:
  push:
    branches:
      - main

  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}
  IMMUTABLE_TAG: sha-${{ github.sha }}
  COOLIFY_API_URL: https://coolify.rhuanbello.com/api/v1

permissions:
  contents: read

jobs:
  build-backend:
    name: Build backend
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_PREFIX }}/securo-backend
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,prefix=sha-
            type=raw,value=${{ env.IMMUTABLE_TAG }}

      - name: Build and push backend
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          file: ./backend/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-frontend:
    name: Build frontend
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_PREFIX }}/securo-frontend
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,prefix=sha-
            type=raw,value=${{ env.IMMUTABLE_TAG }}

      - name: Build and push frontend
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VITE_APP_VERSION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-nimbus:
    name: Deploy Nimbus
    needs:
      - build-backend
      - build-frontend
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: nimbus-production-deploy
      cancel-in-progress: false
    permissions:
      contents: read
      packages: read

    steps:
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify immutable images
        run: |
          set -euo pipefail

          docker buildx imagetools inspect \
            "${IMAGE_PREFIX}/securo-backend:${IMMUTABLE_TAG}" \
            >/dev/null

          docker buildx imagetools inspect \
            "${IMAGE_PREFIX}/securo-frontend:${IMMUTABLE_TAG}" \
            >/dev/null

          echo "Both immutable images are available: ${IMMUTABLE_TAG}"

      - name: Confirm release is still current main
        id: current
        run: |
          set -euo pipefail

          CURRENT_MAIN="$(
            git ls-remote \
              "https://github.com/${GITHUB_REPOSITORY}.git" \
              refs/heads/main |
              awk '{print $1}'
          )"

          if [[ -z "$CURRENT_MAIN" ]]; then
            echo "Could not resolve current main commit." >&2
            exit 1
          fi

          echo "Current main: $CURRENT_MAIN"
          echo "This run:     $GITHUB_SHA"

          if [[ "$CURRENT_MAIN" == "$GITHUB_SHA" ]]; then
            echo "should_deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_deploy=false" >> "$GITHUB_OUTPUT"
            echo "This release was superseded by newer main; skipping deployment."
          fi

      - name: Trigger Coolify deployment
        if: steps.current.outputs.should_deploy == 'true'
        id: deploy
        env:
          COOLIFY_WEBHOOK: ${{ secrets.COOLIFY_WEBHOOK }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
        run: |
          set -euo pipefail

          test -n "$COOLIFY_WEBHOOK"
          test -n "$COOLIFY_TOKEN"

          RESPONSE="$(
            curl \
              --fail-with-body \
              --silent \
              --show-error \
              --request GET \
              "$COOLIFY_WEBHOOK" \
              --header "Authorization: Bearer $COOLIFY_TOKEN"
          )"

          echo "$RESPONSE" | jq .

          DEPLOYMENT_UUID="$(
            echo "$RESPONSE" | jq -r \
              '.deployments[0].deployment_uuid // .deployment_uuid // empty'
          )"

          if [[ -z "$DEPLOYMENT_UUID" ]]; then
            echo "Coolify did not return a deployment UUID." >&2
            exit 1
          fi

          echo "deployment_uuid=$DEPLOYMENT_UUID" >> "$GITHUB_OUTPUT"

      - name: Wait for Coolify deployment
        if: steps.current.outputs.should_deploy == 'true'
        env:
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
          DEPLOYMENT_UUID: ${{ steps.deploy.outputs.deployment_uuid }}
        run: |
          set -euo pipefail

          for attempt in $(seq 1 60); do
            RESPONSE="$(
              curl \
                --fail-with-body \
                --silent \
                --show-error \
                "${COOLIFY_API_URL}/deployments/${DEPLOYMENT_UUID}" \
                --header "Authorization: Bearer $COOLIFY_TOKEN"
            )"

            STATUS="$(echo "$RESPONSE" | jq -r '.status // empty')"
            COMMIT="$(echo "$RESPONSE" | jq -r '.commit // empty')"

            echo "Coolify deployment status: ${STATUS:-unknown}"

            if [[ -n "$COMMIT" && "$COMMIT" != "$GITHUB_SHA" ]]; then
              echo "Coolify is deploying commit $COMMIT, expected $GITHUB_SHA." >&2
              exit 1
            fi

            case "$STATUS" in
              finished|success|successful)
                echo "Nimbus deployment completed successfully for $GITHUB_SHA."
                exit 0
                ;;
              failed|cancelled|cancelled-by-user)
                echo "$RESPONSE" | jq .
                echo "Nimbus deployment failed with status: $STATUS" >&2
                exit 1
                ;;
            esac

            sleep 10
          done

          echo "Timed out waiting for Coolify deployment ${DEPLOYMENT_UUID}." >&2
          exit 1
