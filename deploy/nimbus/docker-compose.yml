name: securo-nimbus

x-backend-env: &backend-env
  DATABASE_URL: "postgresql+asyncpg://securo:${POSTGRES_PASSWORD}@db:5432/securo"
  SECRET_KEY: "${SECRET_KEY}"
  DEBUG: "false"

  FRONTEND_URL: "${FRONTEND_URL}"
  DEFAULT_CURRENCY: "${DEFAULT_CURRENCY:-BRL}"
  REGISTRATION_ENABLED: "${REGISTRATION_ENABLED:-true}"
  LOCAL_AUTH_ENABLED: "true"

  REDIS_URL: "redis://redis:6379/0"

  PLUGGY_CLIENT_ID: "${PLUGGY_CLIENT_ID:-}"
  PLUGGY_CLIENT_SECRET: "${PLUGGY_CLIENT_SECRET:-}"
  PLUGGY_OAUTH_REDIRECT_URI: "${PLUGGY_OAUTH_REDIRECT_URI:-}"

  OIDC_ENABLED: "false"

  OPENEXCHANGERATES_APP_ID: "${OPENEXCHANGERATES_APP_ID:-}"
  FX_SYNC_MODE: "${FX_SYNC_MODE:-on_demand}"

  TESOURO_DIRETO_ENABLED: "true"

  STORAGE_LOCAL_PATH: "/app/data/attachments"
  AGENTS_KNOWLEDGE_STORAGE_PATH: "/app/data/agent_knowledge"

  AGENTS_ENABLED: "false"

x-backend-base: &backend-base
  image: "ghcr.io/rhuanbello/securo-backend:sha-${SOURCE_COMMIT:?SOURCE_COMMIT is required}"
  environment: *backend-env

  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_healthy

  volumes:
    - attachments:/app/data/attachments
    - agent_knowledge:/app/data/agent_knowledge
    - agent_embedding_models:/app/data/embedding_models

  restart: unless-stopped

services:
  db:
    image: "docker.io/pgvector/pgvector:pg16"

    environment:
      POSTGRES_USER: securo
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
      POSTGRES_DB: securo

    volumes:
      - pgdata:/var/lib/postgresql/data

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U securo -d securo
      interval: 5s
      timeout: 3s
      retries: 10

    restart: unless-stopped

  redis:
    image: "docker.io/library/redis:8-alpine"

    healthcheck:
      test:
        - CMD
        - redis-cli
        - ping
      interval: 5s
      timeout: 3s
      retries: 10

    restart: unless-stopped

  backend:
    <<: *backend-base

    command: >
      sh -c "alembic upgrade head &&
      uvicorn app.main:app --host 0.0.0.0 --port 8000"

    expose:
      - "8000"

  celery-worker:
    <<: *backend-base

    command: >
      celery -A app.worker worker
      --loglevel=info
      --concurrency=2

  celery-beat:
    <<: *backend-base

    command: >
      celery -A app.worker beat
      --loglevel=info

  frontend:
    image: "ghcr.io/rhuanbello/securo-frontend:sha-${SOURCE_COMMIT:?SOURCE_COMMIT is required}"

    environment:
      BACKEND_URL: "http://backend:8000"
      FRONTEND_URL: "${FRONTEND_URL}"

    depends_on:
      - backend

    expose:
      - "8080"

    restart: unless-stopped

volumes:
  pgdata:
  attachments:
  agent_knowledge:
  agent_embedding_models:
